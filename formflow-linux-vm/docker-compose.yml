name: formflow

services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./deployment/db.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  backend:
    image: osarietinmen/formflow-backend:1.0.0          # ← version will be updated by the pipeline
    restart: unless-stopped
    env_file:
      - ./deployment/backend.env
    depends_on:
      database:
        condition: service_healthy
    expose:
      - "5000"
    networks:
      - application
      - data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    security_opt:
      - no-new-privileges:true

  frontend:
    image: osarietinmen/formflow-frontend:1.0.0         # ← version will be updated by the pipeline
    restart: unless-stopped
    env_file:
      - ./deployment/frontend.env
    expose:
      - "3000"
    networks:
      - application
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - application
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true

networks:
  application:
    driver: bridge

  data:
    driver: bridge
    internal: true

volumes:
  postgres_data:
    name: formflow_postgres_data