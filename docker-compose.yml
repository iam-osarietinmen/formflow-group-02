services:
    database:
        image: postgres:16-alpine
        container_name: formflow-database
        restart: unless-stopped

        environment:
            POSTGRES_DB: capstone_db
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres

        ports:
            - "5432:5432"

        volumes:
            - postgres_data:/var/lib/postgresql/data

        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d capstone_db"]
            interval: 10s
            timeout: 5s
            retries: 5

    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile

        container_name: formflow-backend
        restart: unless-stopped

        depends_on:
            database:
                condition: service_healthy

        ports:
            - "5000:5000"

        env_file:
            - ./backend/.env

        environment:
            DATABASE_URL: postgresql://postgres:postgres@database:5432/capstone_db
            NODE_ENV: production
            PORT: 5000

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
            args:
                NEXT_PUBLIC_API_URL: http://backend:5000/api

        container_name: formflow-frontend
        restart: unless-stopped

        depends_on:
            - backend

        ports:
            - "80:3000"

        env_file:
            - ./frontend/.env

        environment:
            NODE_ENV: production
            NEXT_PUBLIC_API_URL: http://backend:5000/api
            BACKEND_API_URL: http://backend:5000/api

volumes:
    postgres_data:
